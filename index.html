<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset='utf-8'>
    <meta http-equiv='X-UA-Compatible' content='IE=edge'>
    <title>Cofre Misterioso</title>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <link rel='stylesheet' type='text/css' media='screen' href='styles/style.css'>
</head>
<body>
    <h1>COFRE MISTERIOSO</h1>
    <p>Bem-vindo ao jogo Cofre Misterioso! Escolha um dos botões, ache o prêmio!</p>

    <div class="arena" id="arena">
        <button id="cofre1">Cofre 1</button>
        <button id="cofre2">Cofre 2</button>
        <button id="cofre3">Cofre 3</button>
    </div>

    <div class="Infos" id="Infos">
      <p id="mensagem">Escolha um dos botões!</p>
      <div class="placar" id="placar">
        <p>Tentativas: <span id="tentativas">0</span></p>
        <p>Vitórias: <span id="vitorias">0</span></p>
      </div>
    </div>

    <div>
        <button id="jogarNovamente">Jogar Novamente</button>
    </div>

    <script src='./scripts/index.js'></script>
</body>
</html>
